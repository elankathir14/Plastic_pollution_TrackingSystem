# ======================================================================
# AQUATRACE AI - RENDER BLUEPRINT SPECIFICATION (render.yaml)
# All-in-One Web Service: React UI + FastAPI Backend + YOLOv8 + SQLite
# ======================================================================

services:
  - type: web
    name: aquatrace-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: aquatrace-storage
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DEFAULT_CONFIDENCE_THRESHOLD
        value: "0.28"
      - key: USE_ENVIRONMENTAL_FALLBACK
        value: "true"
